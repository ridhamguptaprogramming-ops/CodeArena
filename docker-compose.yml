services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: codearena, POSTGRES_USER: codearena, POSTGRES_PASSWORD: codearena }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U codearena"], interval: 5s, timeout: 5s, retries: 10 }
  redis: { image: redis:7-alpine, ports: ["6379:6379"] }
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment: { RABBITMQ_DEFAULT_USER: codearena, RABBITMQ_DEFAULT_PASS: codearena }
    ports: ["5672:5672", "15672:15672"]
