services:
  api:
    build: .
    env_file: .env
    environment:
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
    ports: ["8080:8080"]
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    healthcheck: { test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"], interval: 5s, timeout: 3s, retries: 10 }
    volumes: ["redis-data:/data"]
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports: ["5672:5672", "15672:15672"]
    healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 10s, timeout: 5s, retries: 10 }
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
  # Execution workers are a separate deployment boundary. Do not run untrusted code in the API image.
volumes:
  redis-data:
  rabbitmq-data:
